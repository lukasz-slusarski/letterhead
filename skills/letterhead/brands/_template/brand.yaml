# Letterhead brand: BRAND NAME
# Template. Copy it with `python3 letterhead.py new SLUG`, fill it in following BRANDS.md,
# then run `python3 letterhead.py check SLUG`. Note in this comment where the data came from (brand book, website).

name: example.com                 # display name; the brand can also be picked by it (--brand example.com)
description: One sentence about the company and when to use this brand.

contact:                          # shown in the header of contracts, letters and guides
  website: example.com
  email: ""                       # a general company address, not an employee's personal one
  phone: ""

entity:                           # legal data; contracts and letters are refused without it
  name: ""                        # exactly as in the company register
  address: ""
  tax_id: ""
  tax_label: Tax ID               # label printed before tax_id, e.g. VAT, EIN, NIP
  representative: ""

colors:                           # all as #RRGGBB
  text: "#1a1a1a"                 # body text (contrast with white at least 7:1)
  headings: "#1a1a1a"             # headings and bold text
  accent: "#0055ff"               # brand color: dots, bullets, links, alert pills
  on_accent: "#ffffff"            # text on the accent background
  dark: "#1a1a1a"                 # table header, label pill, dark card
  on_dark: "#ffffff"              # text on dark
  muted: "#6b7280"                # footer, dates, captions (contrast with white at least 4.5:1)
  lines: "#e5e7eb"                # table borders, dividers
  card: "#f5f5f5"                 # card and contract parties background
  warm: "#f2efe9"                 # cover and .warm card background

font:
  family: Inter                   # any family name, the same for every file
  files:                          # files in fonts/; ttf, otf or woff2; the license must allow PDF embedding
    - { file: fonts/Inter-Regular.ttf, weight: 400 }
    - { file: fonts/Inter-Bold.ttf, weight: 700 }
    # - { file: fonts/Inter-Italic.ttf, weight: 400, style: italic }
    # variable font: one file, weight as a range: { file: fonts/Inter.woff2, weight: "100 900" }
  # settings: "'wdth' 100"        # font-variation-settings, only for a variable font that needs it
  heading_weight: 700
  heading_tracking: "0"           # heading letter-spacing, e.g. "-0.02em"

logo:
  file: logo.svg                  # version for light backgrounds; SVG preferred, PNG at least 1000 px wide
  light: ""                       # optional version for dark backgrounds
  mark: ""                        # optional logomark (SVG), bottom-left corner from page two on
  mark_height: 5mm
  height: 24px                    # logo height in the header and on the cover

style:
  radius: 12px                    # tables, callouts
  radius_large: 18px              # cards, cover
  title_dot: false                # accent-colored dot after the cover title
  heading_marker: dot             # dot | none: marker before ## headings in documents

footer: example.com               # footer text of proposals and reports

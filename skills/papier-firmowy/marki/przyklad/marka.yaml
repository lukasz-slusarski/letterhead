# Papier firmowy: marka przykładowa (fikcyjna firma, dane zmyślone).
# Skopiuj ją albo _wzor komendą `python3 papier.py nowa SLUG` i podmień na swoje.
# Font: Rubik, SIL Open Font License 1.1 (fonty/OFL.txt), osadzanie w PDF dozwolone.

nazwa: przyklad.pl
opis: Fikcyjna firma do pokazania, jak działa papier firmowy. Zastąp własną marką.

kontakt:
  www: przyklad.pl
  email: biuro@przyklad.pl
  telefon: ""

podmiot:
  nazwa: Przykład sp. z o.o.
  adres: ul. Przykładowa 1, 00-001 Warszawa
  nip: "0000000000"
  reprezentant: Jan Kowalski

kolory:
  tekst: "#1f2430"
  naglowki: "#14213d"
  akcent: "#2f5bea"
  na_akcencie: "#ffffff"
  ciemny: "#14213d"
  na_ciemnym: "#ffffff"
  przygaszony: "#5f6675"
  linie: "#e3e6ec"
  karta: "#f4f6fa"
  cieply: "#eef2fb"

font:
  rodzina: Rubik
  pliki:
    - { plik: fonty/Rubik-Regular.ttf, waga: 400 }
    - { plik: fonty/Rubik-Bold.ttf, waga: 700 }
    - { plik: fonty/Rubik-Italic.ttf, waga: 400, styl: italic }
    - { plik: fonty/Rubik-BoldItalic.ttf, waga: 700, styl: italic }
  waga_naglowkow: 700
  odstep_naglowkow: "0"

logo:
  plik: logo.svg
  jasne: ""
  znak: znak.svg
  znak_wysokosc: 5mm
  wysokosc: 26px

styl:
  zaokraglenie: 12px
  zaokraglenie_duze: 18px
  kropka_w_tytule: true
  znacznik_naglowka: kropka

stopka: przyklad.pl

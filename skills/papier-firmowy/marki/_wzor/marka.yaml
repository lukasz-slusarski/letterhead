# Papier firmowy: NAZWA MARKI
# Wzór. Skopiuj komendą `python3 papier.py nowa SLUG`, uzupełnij według KONFIGURACJA.md,
# potem `python3 papier.py sprawdz SLUG`. W komentarzu na górze wpisz, skąd są dane (ścieżki, link do brand booka).

nazwa: przyklad.pl                # nazwa wyświetlana, po niej też da się wybrać markę (--marka przyklad.pl)
opis: Jedno zdanie, czym jest firma i kiedy jej używać.

kontakt:                          # pokazuje się w nagłówku umów, listów i instrukcji
  www: przyklad.pl
  email: ""                       # adres ogólny firmy, nie prywatny pracownika
  telefon: ""

podmiot:                          # dane prawne; bez nich nie powstanie umowa ani list
  nazwa: ""                       # dokładnie jak w KRS/CEIDG
  adres: ""
  nip: ""
  reprezentant: ""

kolory:                           # wszystkie jako #RRGGBB
  tekst: "#1a1a1a"                # tekst akapitów (kontrast z bielą co najmniej 7:1)
  naglowki: "#1a1a1a"             # nagłówki i pogrubienia
  akcent: "#0055ff"               # kolor marki: kropki, punktory, linki, pigułki alarmowe
  na_akcencie: "#ffffff"          # tekst na tle akcentu
  ciemny: "#1a1a1a"               # nagłówek tabeli, pigułka z etykietą, ciemna karta
  na_ciemnym: "#ffffff"           # tekst na ciemnym
  przygaszony: "#6b7280"          # stopka, daty, podpisy (kontrast z bielą co najmniej 4,5:1)
  linie: "#e5e7eb"                # ramki tabel, linie podziału
  karta: "#f5f5f5"                # tło kart i bloku stron umowy
  cieply: "#f2efe9"               # tło okładki i karty .warm

font:
  rodzina: Inter                  # nazwa rodziny, dowolna, byle ta sama we wszystkich plikach
  pliki:                          # pliki w podkatalogu fonty/; ttf, otf albo woff2; licencja musi pozwalać na osadzanie w PDF
    - { plik: fonty/Inter-Regular.ttf, waga: 400 }
    - { plik: fonty/Inter-Bold.ttf, waga: 700 }
    # - { plik: fonty/Inter-Italic.ttf, waga: 400, styl: italic }
    # font zmienny: jeden plik, waga jako zakres: { plik: fonty/Inter.woff2, waga: "100 900" }
  # ustawienia: "'wdth' 100"      # font-variation-settings, tylko dla fontu zmiennego, który tego wymaga
  waga_naglowkow: 700
  odstep_naglowkow: "0"           # letter-spacing nagłówków, np. "-0.02em"

logo:
  plik: logo.svg                  # wersja na jasne tło; SVG najlepiej, PNG co najmniej 1000 px szerokości
  jasne: ""                       # opcjonalnie wersja na ciemne tło
  znak: ""                        # opcjonalnie logomark (SVG) w lewym dolnym rogu stron od drugiej
  znak_wysokosc: 5mm
  wysokosc: 24px                  # wysokość logo w nagłówku i na okładce

styl:
  zaokraglenie: 12px              # tabele, callouty
  zaokraglenie_duze: 18px         # karty, okładka
  kropka_w_tytule: false          # kropka w kolorze akcentu po tytule na okładce
  znacznik_naglowka: kropka       # kropka | brak: znak przed nagłówkiem ## w dokumentach

stopka: przyklad.pl               # tekst w stopce ofert i raportów
